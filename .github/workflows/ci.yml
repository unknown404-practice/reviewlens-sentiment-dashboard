name: ReviewLens CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Validation & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Bytecode Syntax Compilation Check
        run: |
          python -m compileall backend

      - name: Run Pytest Test Suite
        env:
          ENABLE_PLAYWRIGHT_SCRAPING: "false"
          ENVIRONMENT: "test"
        run: |
          echo "### 🧪 Pytest Execution Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          set -o pipefail
          python -m pytest -v --tb=short 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  frontend-build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend-next
        run: |
          npm ci

      - name: Build Next.js Application
        working-directory: frontend-next
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8000"
        run: |
          npm run build
